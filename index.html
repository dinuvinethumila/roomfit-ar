<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>RoomFit AR — Catalog Scanner</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
  body { margin:0; }
  #hud { position:fixed; top:0; left:0; right:0; z-index:999;
    background:linear-gradient(135deg,#241d15,#4a3a22);
    padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
  #hud .brand { display:flex; align-items:center; gap:8px; }
  #hud h1 { color:#fdf0dd; font-size:1rem; font-weight:700; margin:0; letter-spacing:0.3px; }
  #hud .tagline { color:#c9a876; font-size:0.65rem; display:block; margin-top:1px; }
  #nav-btn { background:#e8a24f; color:#241d15; border:none; padding:9px 16px;
    border-radius:8px; font-size:0.8rem; cursor:pointer; font-weight:700; }
  #info-card { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.14); backdrop-filter:blur(10px); color:#fff;
    padding:14px 20px; border-radius:14px; font-size:0.85rem; text-align:center;
    z-index:999; max-width:340px; border:1px solid rgba(255,255,255,0.25); display:none; }
  #item-name { color:#f5c579; font-weight:700; font-size:1rem; display:block; margin-bottom:4px; }
  #item-price { color:#9fd3a8; font-weight:600; font-size:0.78rem; display:block; margin-top:4px; }
</style>
</head>
<body>

<div id="hud">
  <div class="brand">
    <h1>🏠 RoomFit AR<span class="tagline">Catalog Scanner</span></h1>
  </div>
  <button id="nav-btn" onclick="window.location.href='room.html'">→ Place in Room</button>
</div>

<div id="info-card">
  <span id="item-name"></span>
  <span id="item-desc"></span>
  <span id="item-price"></span>
</div>

<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth:1280; sourceHeight:960; displayWidth:1280; displayHeight:960;"
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer:true; antialias:true;"
  loading-screen="enabled:false">

  <!-- MARKER 1: Pendant Light product tag -->
  <a-marker type="pattern" url="markers/pendant-marker.patt" id="pendant-marker">

    <a-cylinder position="0 0.01 0" radius="0.5" height="0.02" color="#241d15" opacity="0.9"></a-cylinder>

    <a-entity id="pendant-entity"
      position="0 0.9 0"
      class="clickable-item"
      animation="property: rotation; to: 0 360 0; loop:true; dur:6000; easing:linear">

      <a-box position="0 0 0" width="0.5" height="0.02" depth="0.05" color="#4a3a22"></a-box>

      <a-cylinder position="-0.18 -0.15 0" radius="0.005" height="0.3" color="#2b2318"></a-cylinder>
      <a-cone position="-0.18 -0.26 0" radius-bottom="0.08" radius-top="0.02" height="0.06" color="#e8a24f" rotation="180 0 0"></a-cone>
      <a-sphere position="-0.18 -0.32 0" radius="0.06" color="#f5c579"></a-sphere>

      <a-cylinder position="0 -0.2 0" radius="0.005" height="0.4" color="#2b2318"></a-cylinder>
      <a-cone position="0 -0.36 0" radius-bottom="0.08" radius-top="0.02" height="0.06" color="#e8a24f" rotation="180 0 0"></a-cone>
      <a-sphere position="0 -0.42 0" radius="0.06" color="#ffffff"></a-sphere>

      <a-cylinder position="0.18 -0.15 0" radius="0.005" height="0.3" color="#2b2318"></a-cylinder>
      <a-cone position="0.18 -0.26 0" radius-bottom="0.08" radius-top="0.02" height="0.06" color="#e8a24f" rotation="180 0 0"></a-cone>
      <a-sphere position="0.18 -0.32 0" radius="0.06" color="#f5c579"></a-sphere>
    </a-entity>

    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="point" color="#f5c579" intensity="1.1" position="0 1.5 0"></a-light>
  </a-marker>

  <!-- MARKER 2: Ceramic Vase product tag -->
  <a-marker type="pattern" url="markers/vase-marker.patt" id="vase-marker">

    <a-cylinder position="0 0.01 0" radius="0.5" height="0.02" color="#241d15" opacity="0.9"></a-cylinder>

    <a-entity id="vase-entity"
      position="0 0.15 0"
      class="clickable-item"
      animation="property: position; from: 0 0.15 0; to: 0 0.24 0; dir: alternate; loop:true; dur:1500;">

      <a-cylinder position="0 0 0" radius="0.09" height="0.28" color="#c98b56"></a-cylinder>
      <a-cylinder position="0 0.17 0" radius="0.035" height="0.08" color="#e2e8f0"></a-cylinder>
      <a-cylinder position="0 0.22 0" radius="0.045" height="0.05" color="#4a3a22"></a-cylinder>
      <a-plane position="0 0 0.091" width="0.14" height="0.16" color="#ffffff" opacity="0.9"></a-plane>
    </a-entity>

    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="point" color="#f5c579" intensity="1.1" position="0 1.5 0"></a-light>
  </a-marker>

  <a-entity camera>
    <a-entity cursor="fuse:false; rayOrigin:mouse;"
      raycaster="objects:.clickable-item; recursive:true;">
    </a-entity>
  </a-entity>
</a-scene>

<script>
const PRODUCTS = {
  pendant: { name:"Nordic Pendant Light", desc:"Sculptural multi-bulb fixture — adds warm, multi-directional lighting.", price:"LKR 12,500" },
  vase: { name:"Ceramic Vase", desc:"Handcrafted decorative vase — perfect for a console table or shelf.", price:"LKR 5,900" }
};

function showInfo(key) {
  const p = PRODUCTS[key];
  document.querySelector('#item-name').textContent = p.name;
  document.querySelector('#item-desc').textContent = p.desc;
  document.querySelector('#item-price').textContent = p.price;
  document.querySelector('#info-card').style.display = 'block';
}

function hideInfo() {
  document.querySelector('#info-card').style.display = 'none';
}

document.querySelector('#pendant-marker').addEventListener('markerFound', () => showInfo('pendant'));
document.querySelector('#pendant-marker').addEventListener('markerLost', hideInfo);

document.querySelector('#vase-marker').addEventListener('markerFound', () => showInfo('vase'));
document.querySelector('#vase-marker').addEventListener('markerLost', hideInfo);
</script>
</body>
</html>
